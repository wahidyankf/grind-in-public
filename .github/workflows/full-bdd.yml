name: Full BDD verification

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: apps/*/go.sum
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx nx run wahidyankf-www-e2e:install
      - name: Run canonical scheduled verification
        run: npm run test:scheduled
