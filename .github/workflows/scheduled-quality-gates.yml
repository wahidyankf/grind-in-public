name: Scheduled quality gates

on:
  schedule:
    - cron: "0 6,18 * * *"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-quality-gates
  cancel-in-progress: false

jobs:
  website:
    name: Website test symphony
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Run local integration coverage
        run: npm exec -- nx run -p wahidyankf-www -t test:coverage:integration
      - name: Install Chromium and system dependencies
        run: npm exec -- nx run -p wahidyankf-www-e2e -t install
      - name: Run browser end-to-end suite
        run: npm exec -- nx run -p wahidyankf-www-e2e -t test:e2e -- --workers=1
