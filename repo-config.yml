# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.12.0/schemas/repo-config/v2.schema.json
# Read only by RHINO's Markdown checks (internal links and Mermaid). Nothing else reads this file.
schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - .nx
    - node_modules
    - local-tmp
    - generated-reports
    - dist

policies:
  markdown:
    internal-link:
      exclude-sources: []
    mermaid:
      authoring-rule: plain-text
      node-label-graphemes: 32
      edge-label-graphemes: 24
      fill-colors: []
      edge-colors: []
      text-colors: []
