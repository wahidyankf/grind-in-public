# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.10.0/schemas/repo-config/v2.schema.json
schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - .nx
    - node_modules
    - local-tmp
    - generated-reports
    - dist

harness:
  canonical:
    agents:
      name: name
      description: description
      tier: tier
      grants: capabilities
      denials: denies
      constraints: constraints
      dispatches: dispatches
    skills:
      name: name
      description: description
  requirements:
    capabilities: [repository-read, repository-write, shell, network, subagent]
    constraints:
      [read-only, inline-result-only, owner-solved-first, no-solution-output]
    routes: [canonical-import]
    identities: [description]
  profiles:
    - id: claude
      supports:
        capabilities:
          [repository-read, repository-write, shell, network, subagent]
        constraints:
          [
            read-only,
            inline-result-only,
            owner-solved-first,
            no-solution-output,
          ]
        routes: [canonical-import]
        identities: [description]
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route:
          "Before acting, read the complete canonical agent definition at the
          repository-root path\n{path}\nand follow it as authoritative. If it
          cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: effort }
        dispatches: { field: tools, format: "Agent({names})" }
        empty-tier: { model: inherit }
        translations:
          - { when: always, field: tools, members: [Read] }
          - {
              when: requires,
              capability: repository-read,
              field: tools,
              members: [Glob, Grep],
            }
          - {
              when: requires,
              capability: repository-write,
              field: tools,
              members: [Write, Edit],
            }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - {
              when: requires,
              capability: network,
              field: tools,
              members: [WebSearch, WebFetch],
            }
          - {
              when: constrains,
              capability: read-only,
              field: tools,
              absent-members: [Write, Edit],
            }
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route:
          "Read {path} completely,\nresolve every relative resource from that
          skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
      tiers:
        ultra: {}
        plan: {}
        execution: { model: sonnet, effort: xhigh }
        fast: { model: haiku, effort: xhigh }
    - id: codex
      supports:
        capabilities:
          [repository-read, repository-write, shell, network, subagent]
        constraints:
          [
            read-only,
            inline-result-only,
            owner-solved-first,
            no-solution-output,
          ]
        routes: [canonical-import]
        identities: [description]
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route:
          "Before acting, read the complete canonical agent definition at the
          repository-root path\n{path}\nand follow it as authoritative. If it
          cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        fixed: { sandbox_mode: read-only }
        tier-fields: { model: model, effort: model_reasoning_effort }
      tiers:
        ultra: {}
        plan: {}
        execution: {}
        fast:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-luna
            fallback: gpt-6-luna
          effort: xhigh
    - id: opencode
      supports:
        capabilities:
          [repository-read, repository-write, shell, network, subagent]
        constraints:
          [
            read-only,
            inline-result-only,
            owner-solved-first,
            no-solution-output,
          ]
        routes: [canonical-import]
        identities: [description]
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route:
          "Before acting, read the complete canonical agent definition at the
          repository-root path\n{path}\nand follow it as authoritative. If it
          cannot be read, stop and report the missing path."
        identity: { description: description }
        fixed: { mode: subagent }
        dispatches: { field: permission.task, format: allow-map }
        translations:
          # Deny by default; each granted capability below re-allows its entry.
          - {
              when: always,
              field: permission,
              entries:
                {
                  read: allow,
                  edit: deny,
                  bash: deny,
                  webfetch: deny,
                  websearch: deny,
                },
            }
          - {
              when: requires,
              capability: repository-read,
              field: permission,
              entries: { glob: allow, grep: allow },
            }
          - {
              when: requires,
              capability: repository-write,
              field: permission,
              entries: { edit: allow },
            }
          - {
              when: requires,
              capability: shell,
              field: permission,
              entries: { bash: allow },
            }
          - {
              when: requires,
              capability: network,
              field: permission,
              entries: { webfetch: allow, websearch: allow },
            }

policies:
  markdown:
    metadata:
      surfaces:
        - glob: ".agents/skills/*/SKILL.md"
          schema: skill
        - glob: ".agents/agents/*.md"
          schema: agent
        - glob: ".agents/agents/README.md"
          schema: governance
    internal-link:
      exclude-sources: ["specs/fixtures/**", "plans/done/**"]
    mermaid:
      authoring-rule: plain-text
      node-label-graphemes: 32
      edge-label-graphemes: 24
      fill-colors: []
      edge-colors: []
      text-colors: []
  governance:
    word-budget:
      count: whitespace-separated
      surfaces:
        - { glob: "AGENTS.md", fail: 750 }
        - { glob: "CLAUDE.md", fail: 750 }
        - { glob: "repo-governance/**/*.md", fail: 750 }
        - { glob: ".agents/README.md", fail: 750 }
        - { glob: ".claude/README.md", fail: 750 }
        - { glob: ".codex/README.md", fail: 750 }
        - { glob: ".opencode/README.md", fail: 750 }
    directory-map:
      trees: []
    quality-gates:
      root: repo-governance/workflows
      agents: .agents/agents
      groups: [plan, quality, maintenance]
      gate-group: quality
      gate-headings:
        [
          Entry,
          Inputs,
          Deterministic Boundary,
          Cycle,
          Termination,
          Verdict,
          Ledger,
        ]
      verdict-heading: Verdict
      verdicts: [PASS, PASS_WITH_FINDINGS, FAIL, BLOCKED]
      retired-inputs: [max-iterations, min-iterations, max-audits]
      propagation-headings:
        [Contract, Scope, Executor, Row Verification, Family Rules]
      defaults: { mode: normal, max-cycles: 3 }
      gates:
        - { family: plan }
        - { family: docs }
        - { family: rules }
        - { family: harness }
        - { family: ci }
        - { family: pr-review }
        - { family: specs }
        - {
            family: ui-web,
            subject: apps/wahidyankf-www,
            judge: swe-web-tester,
            repairer: swe-developer,
          }
        - {
            family: api-http,
            subject: apps/forum-be-python,
            judge: swe-api-tester,
            repairer: swe-developer,
          }

extensions:
  # Owner: repo-governance/development/quality/stacks/repository-adapter.md
  software-development:
    projects:
      wahidyankf-www:
        path: apps/wahidyankf-www
        kind: app
        stacks: [typescript, javascript, react, nextjs]
      wahidyankf-www-e2e:
        path: apps/wahidyankf-www-e2e
        kind: app
        stacks: [typescript, javascript]
      forum-be-python:
        path: apps/forum-be-python
        kind: app
        stacks: [python]
      go-tools:
        path: tools
        kind: tooling
        stacks: [golang]
      repo-scripts:
        path: scripts
        kind: tooling
        stacks: [javascript, shell]
      public-safety:
        path: scripts/public-safety
        kind: tooling
        stacks: [shell]
      opencode-plugin:
        path: .opencode/plugin
        kind: tooling
        stacks: [javascript]
      claude-hooks:
        path: .claude/hooks
        kind: tooling
        stacks: [shell]
      ci-scripts:
        path: .github/scripts
        kind: tooling
        stacks: [shell]
      workspace:
        path: .
        kind: tooling
        stacks: [nx]

gates:
  composition:
    pull-request: { relation: exact }
  entries:
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
      run-on: { pre-commit: {}, pre-push: {}, pull-request: {}, main: {} }
    - id: public-safety-commit-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: bash
        args:
          - { literal: scripts/public-safety/check-commit-message }
          - { input: message.text, expand: single }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: public-safety-tests
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/tests/run.sh }]
      run-on: { main: {} }
    - id: commitlint
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: ./scripts/validate-commit-message
        args: [{ input: message.text, expand: single }]
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: format-staged
      type: mutation
      inputs:
        staged: { kind: files }
      mutation: { local: apply-index, ci: verify-clean }
      command:
        executable: ./scripts/format-staged
        args: [{ input: staged.paths, expand: repeat }]
      run-on:
        pre-commit:
          bind:
            staged: { source: git-index }
        pull-request:
          bind:
            staged: { source: explicit-range, range: explicit }
    - id: repo-config
      type: check
      command:
        executable: ./rhino
        args: [{ literal: repo-config }, { literal: validate }]
      run-on: { main: {} }
    - id: word-budget
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: word-budget },
            { literal: validate },
          ]
      run-on: { main: {} }
    - id: quality-gates
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: quality-gates },
            { literal: validate },
          ]
      run-on: { main: {} }
    - id: directory-map
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: directory-map },
            { literal: validate },
          ]
      run-on: { main: {} }
    - id: harness-adapters
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: harness }, { literal: adapters }, { literal: validate }]
      run-on: { main: {} }
    - id: internal-link
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: md }, { literal: internal-link }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: markdown-line-length
      type: check
      command:
        executable: ./node_modules/.bin/markdownlint-cli2
        args: []
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: mermaid
      type: check
      command:
        executable: ./rhino
        args: [{ literal: md }, { literal: mermaid }, { literal: validate }]
      run-on: { main: {} }
