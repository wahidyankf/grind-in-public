# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.13.0/schemas/repo-config/v2.schema.json
# Read only by RHINO's Markdown checks (internal links and Mermaid). Nothing else reads this file.
schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - .nx
    - node_modules
    - local-tmp
    - generated-reports
    - dist

policies:
  markdown:
    internal-link:
      exclude-sources: []
    mermaid:
      authoring-rule: rendered
      node-label-graphemes: 32
      edge-label-graphemes: 24
      fill-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      edge-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      text-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      require-default-class: true
