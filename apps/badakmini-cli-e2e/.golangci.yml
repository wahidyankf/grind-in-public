# Keep E2E checks as strict as the owner module while allowing only its public BDD support.
version: "2"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true

linters:
  default: all
  disable:
    - err113
    - exhaustruct
    - gochecknoglobals
    # The standalone E2E module deliberately replaces the sibling owner module.
    - gomoddirectives
    - gomodguard
    - govet
    - nlreturn
    - noctx
    - noinlineerr
    - paralleltest
    - testpackage
    - wsl
    - wsl_v5
  settings:
    depguard:
      rules:
        e2e-test-support:
          files:
            - $all
          allow:
            - $gostd
            - github.com/wahidyankf/grind-in-public/apps/badakmini-cli
            - github.com/cucumber/godog
    goconst:
      ignore-tests: true
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      severity: error
      rules:
        - name: exported
          severity: error
  exclusions:
    generated: strict
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  modules-download-mode: readonly
  relative-path-mode: gomod
