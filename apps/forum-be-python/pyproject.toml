[project]
name = "forum-be-python"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "psycopg[binary,pool]==3.3.6",
    "uvicorn==0.53.0",
]

# The app runs from src/ directly, so there is nothing to build or install as a package.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[dependency-groups]
dev = [
    "httpx2==2.13.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
]
