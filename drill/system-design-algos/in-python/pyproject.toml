[project]
name = "system-design-algos"
version = "0.1.0"
description = "Twenty system design algorithms in Python, each with its tests."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.uv]
# Resolve only releases published before this date, so every pinned version is more than 7 days old.
exclude-newer = "2026-10-08T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["algo_*_test.py"]

[tool.pyright]
include = ["."]
exclude = [".venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
